name: kumarket
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  get_storage: ^2.1.1
  get_it: ^8.0.3
  path_provider: ^2.1.5
  mask_text_input_formatter: ^2.9.0
  flutter_timer_countdown: ^1.0.7
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Schyler
      fonts:
        - asset: assets/fonts/gilroy/Gilroy-Light.otf
        
   

